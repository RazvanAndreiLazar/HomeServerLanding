<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Home Server</title>
<style>
  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --text: #1d1f22;
    --muted: #6b6f76;
    --border: #e2ded6;
    --accent: #2f6f5e;
    --ok: #2e9a5c;
    --down: #c4473a;
    --unknown: #b7b2a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141618;
      --surface: #1d2023;
      --text: #e8e6e1;
      --muted: #9a9ea4;
      --border: #2c3034;
      --accent: #6fbfa6;
      --ok: #4fc282;
      --down: #e0675a;
      --unknown: #5a5e63;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 16px 64px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 1.75rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .top { display: flex; align-items: center; gap: 10px; }
  .icon { font-size: 1.4rem; width: 1.6em; text-align: center; }
  .name { font-weight: 600; flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unknown); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.down { background: var(--down); }
  .desc { color: var(--muted); font-size: .92rem; margin: 0; }
  .lan { font-size: .82rem; color: var(--accent); text-decoration: none; align-self: flex-start; }
  .lan:hover { text-decoration: underline; }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="greeting">Home Server</h1>
    <p class="sub" id="clock"></p>
  </header>
  <section class="grid" id="apps" aria-label="Applications"></section>
  <footer>Reachable only inside the tailnet. Dots show whether each app answered just now.</footer>
</main>

<script>
/* ===== Edit this block to add or change apps =====
   TAILNET and LAN come from /config.json (set in .env on the server),
   so no machine-specific address is stored in this file. */
const appList = (TAILNET, LAN) => [
  {
    name: "Immich",
    icon: "📷",
    description: "Photos and videos",
    url: `https://immich.${TAILNET}`,
    lanUrl: LAN && `http://${LAN}:2283`
  },
  // {
  //   name: "Paperless",
  //   icon: "📄",
  //   description: "Documents",
  //   url: `https://docs.${TAILNET}`,
  //   lanUrl: LAN && `http://${LAN}:8000`
  // },
];
/* ================================================== */

const grid = document.getElementById("apps");

async function loadConfig() {
  try {
    const r = await fetch("/config.json", { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch {}
  return {};
}

loadConfig().then(cfg => {
  // server.tailXXXX.ts.net -> tailXXXX.ts.net
  const serverName = cfg.serverName || location.hostname;
  const tailnet = serverName.split(".").slice(1).join(".");
  for (const app of appList(tailnet, cfg.lanIp)) renderApp(app);
});

function renderApp(app) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = app.url;

  const top = document.createElement("div");
  top.className = "top";
  const icon = document.createElement("span");
  icon.className = "icon"; icon.textContent = app.icon || "•";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = app.name;
  const dot = document.createElement("span");
  dot.className = "dot"; dot.title = "Checking…";
  top.append(icon, name, dot);

  const desc = document.createElement("p");
  desc.className = "desc"; desc.textContent = app.description || "";
  card.append(top, desc);

  if (app.lanUrl) {
    const lan = document.createElement("a");
    lan.className = "lan"; lan.href = app.lanUrl;
    lan.textContent = "Open on home network";
    lan.addEventListener("click", e => e.stopPropagation());
    card.append(lan);
  }
  grid.append(card);
  check(app.url, dot);
}

// Rough reachability check: an opaque response means the host answered.
async function check(url, dot) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 5000);
  try {
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
    dot.classList.add("ok"); dot.title = "Reachable";
  } catch {
    dot.classList.add("down"); dot.title = "Not reachable";
  } finally { clearTimeout(t); }
}

function tick() {
  const now = new Date();
  const h = now.getHours();
  document.getElementById("greeting").textContent =
    h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("clock").textContent = now.toLocaleString(undefined, {
    weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"
  });
}
tick(); setInterval(tick, 30000);
</script>
</body>
</html>
