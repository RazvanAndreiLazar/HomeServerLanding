# gateway/authelia/config/configuration.yml
# The machine name comes from SERVER_NAME in .env (template filter enabled in docker-compose.yml).
# Secrets are NOT in this file; they come from /secrets via docker-compose.yml.

server:
  address: 'tcp://:9091/auth'          # portal and API live under https://<SERVER_NAME>/auth
                                       # (Caddy serves our own login page at /auth/ itself)
  asset_path: '/assets/'               # logo.png and favicon.ico for Authelia's own pages

log:
  level: 'info'

theme: 'auto'                          # follows light/dark mode

authentication_backend:
  password_reset:
    disable: true                      # no email server; you reset passwords by editing the users file
  file:
    path: '/config/users_database.yml'
    watch: true                        # picks up edits to the users file without a restart
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'               # anything not listed below is refused
  rules:
    - domain: '{{ env "SERVER_NAME" }}'
      resources:
        - '^/whoami([/?].*)?$'
      subject: 'group:family'
      policy: 'one_factor'             # password only; inside the tailnet this is reasonable

session:
  cookies:
    - domain: '{{ env "SERVER_NAME" }}'  # exact machine name, not *.ts.net
      authelia_url: 'https://{{ env "SERVER_NAME" }}/auth'
      default_redirection_url: 'https://{{ env "SERVER_NAME" }}/'
      expiration: '1h'                 # normal session
      inactivity: '30m'
      remember_me: '30d'               # when "Remember me" is ticked

regulation:                            # brute-force protection
  max_retries: 5
  find_time: '10m'
  ban_time: '15m'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'   # messages are written here instead of emailed

identity_providers:
  oidc:
    # Browser-based clients (OpenCloud web) call these endpoints from their own host, so they
    # need CORS headers. Allowed origins = the hosts in the clients' redirect_uris below.
    cors:
      endpoints: ['token', 'userinfo', 'revocation', 'introspection']
      allowed_origins_from_client_redirect_uris: true
    # Uptime Kuma (apps/kuma): only the group "admins" may log in. Goes under identity_providers.oidc
    # in gateway/authelia/config/configuration.yml (next to cors/jwks/clients).
    authorization_policies:
      admins_only:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: 'group:admins'
    # OpenCloud web (apps/opencloud): short access tokens and no refresh token, so the web app
    # renews through the Authelia session and stops working within ~1 minute of logging out.
    lifespans:
      custom:
        opencloud_web:
          access_token: '1m'
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc_jwks.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: 'immich'
        client_name: 'Immich'
        client_secret: '{{ secret "/secrets/immich_client_digest" }}'
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'          # no "allow Immich?" screen for family
        redirect_uris:
          - 'https://{{ env "IMMICH_HOST" }}/auth/login'
          - 'https://{{ env "IMMICH_HOST" }}/user-settings'
          - 'app.immich:///oauth-callback'  # mobile app
        scopes: ['openid', 'profile', 'email']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'

      # openCloud (apps/opencloud): one public client per app type, PKCE, no client secret.
      # From Authelia's openCloud guide; policy and consent aligned with Immich above.
      # Appended to identity_providers.oidc.clients in gateway/authelia/config/configuration.yml.
      - client_id: 'opencloud'
        client_name: 'OpenCloud'
        public: true
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://{{ env "OPENCLOUD_HOST" }}/'
          - 'https://{{ env "OPENCLOUD_HOST" }}/oidc-callback.html'
          - 'https://{{ env "OPENCLOUD_HOST" }}/oidc-silent-redirect.html'
        # No offline_access/refresh token: the web app renews via the Authelia session instead
        # (silent renew), so logging out on the gateway also ends OpenCloud in the browser.
        lifespan: 'opencloud_web'           # 1-minute access tokens, see lifespans above
        scopes: ['openid', 'groups', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'none'
      - client_id: 'opencloud-android'
        client_name: 'OpenCloud (Android)'
        public: true
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['oc://android.opencloud.eu']
        scopes: ['openid', 'offline_access', 'groups', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'none'
      - client_id: 'opencloud-ios'
        client_name: 'OpenCloud (iOS)'
        public: true
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['oc://ios.opencloud.eu', 'oc.ios://ios.opencloud.eu']
        scopes: ['openid', 'offline_access', 'groups', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'none'
      - client_id: 'opencloud-desktop'
        client_name: 'OpenCloud (desktop)'
        public: true
        authorization_policy: 'one_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris: ['http://127.0.0.1', 'http://localhost']   # desktop app listens locally
        scopes: ['openid', 'offline_access', 'groups', 'profile', 'email']
        response_types: ['code']
        grant_types: ['authorization_code', 'refresh_token']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'none'
      # Uptime Kuma (apps/kuma): oauth2-proxy in front of Kuma logs in with this client.
      # Appended to identity_providers.oidc.clients in gateway/authelia/config/configuration.yml.
      - client_id: 'kuma'
        client_name: 'Uptime Kuma'
        client_secret: '{{ secret "/secrets/kuma_client_digest" }}'
        public: false
        authorization_policy: 'admins_only'   # see authorization_policies above
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://{{ env "KUMA_HOST" }}/oauth2/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

      # Beszel (apps/beszel): oauth2-proxy in front of Beszel logs in with this client.
      # Uses the policy admins_only (added with Uptime Kuma, apps/kuma/authelia-clients.yml).
      # Appended to identity_providers.oidc.clients in gateway/authelia/config/configuration.yml.
      - client_id: 'beszel'
        client_name: 'Beszel'
        client_secret: '{{ secret "/secrets/beszel_client_digest" }}'
        public: false
        authorization_policy: 'admins_only'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://{{ env "BESZEL_HOST" }}/oauth2/callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
